[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codelens-mcp"
version = "0.1.0"
description = "A repo-aware MCP server for semantic codebase search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "tree-sitter-language-pack",
    "google-genai",
    "sqlite-vec",
    "click",
    "rich"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff"
]

[project.scripts]
codelens = "codelens.indexer:cli"
codelens-analytics = "codelens.analytics:cli"
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "N", "B", "UP", "SIM"]
ignore = ["BLE001", "SIM102", "E501", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false